# Dokploy app: infra
# Watch paths: docker-compose.infra.yml
# Deploy this first. It creates dmcu-app-network for the other stacks.
name: dmcu-infra

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: dmcu-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmcu_local}
      POSTGRES_DB: ${POSTGRES_DB:-dmcu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  nim-prod:
    image: nvcr.io/nim/openai/gpt-oss-20b:2.0.8
    container_name: dmcu-prod-nim
    # Do not set runtime: nvidia. That legacy runtime bind-mounts
    # /run/nvidia-persistenced/socket and fails if persistenced is not running.
    # Compose device reservations use the NVIDIA Container Toolkit instead.
    shm_size: "16gb"
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - nim_cache:/opt/nim/.cache
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    name: dmcu-app-network

volumes:
  postgres_data:
    name: dmcu-prod_postgres_data
  nim_cache:
    name: dmcu-prod_nim_cache
