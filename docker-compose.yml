name: dmcu-prod

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: dmcu-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmcu_local}
      POSTGRES_DB: ${POSTGRES_DB:-dmcu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  nim-prod:
    image: nvcr.io/nim/openai/gpt-oss-20b:2.0.8
    container_name: dmcu-prod-nim
    runtime: nvidia
    shm_size: "16gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
    volumes:
      - nim_cache:/opt/nim/.cache
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped
    networks:
      - app-network

  backend-prod:
    container_name: dmcu-prod-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    depends_on:
      postgres-prod:
        condition: service_healthy
      nim-prod:
        condition: service_healthy
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8000:8082"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dmcu:dmcu_local@postgres-prod:5432/dmcu}
      DEDUP_SALT: ${DEDUP_SALT:-dev-salt-change-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-nim}
      NIM_BASE_URL: ${NIM_BASE_URL:-http://nim-prod:8000}
      NIM_API_KEY: ${NIM_API_KEY:-none}
      NIM_MODEL: ${NIM_MODEL:-openai/gpt-oss-20b}
      NIM_CHAT_MODEL: ${NIM_CHAT_MODEL:-openai/gpt-oss-20b}
      JOB_BACKEND: ${JOB_BACKEND:-procrastinate}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/Port_of_Spain}
      SURVEY123_TRANSPORT: ${SURVEY123_TRANSPORT:-inprocess}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - app-network
      - dokploy-network

  worker-prod:
    container_name: dmcu-prod-worker
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    command: ["worker"]
    depends_on:
      postgres-prod:
        condition: service_healthy
      backend-prod:
        condition: service_healthy
      nim-prod:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dmcu:dmcu_local@postgres-prod:5432/dmcu}
      DEDUP_SALT: ${DEDUP_SALT:-dev-salt-change-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-nim}
      NIM_BASE_URL: ${NIM_BASE_URL:-http://nim-prod:8000}
      NIM_API_KEY: ${NIM_API_KEY:-none}
      NIM_MODEL: ${NIM_MODEL:-openai/gpt-oss-20b}
      NIM_CHAT_MODEL: ${NIM_CHAT_MODEL:-openai/gpt-oss-20b}
      JOB_BACKEND: ${JOB_BACKEND:-procrastinate}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/Port_of_Spain}
      SURVEY123_TRANSPORT: ${SURVEY123_TRANSPORT:-inprocess}
    restart: unless-stopped
    networks:
      - app-network

  frontend-prod:
    container_name: dmcu-prod-frontend
    build:
      context: ./apps/frontend
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: /api
    expose:
      - "8081"
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - dokploy-network

networks:
  app-network:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  nim_cache:
