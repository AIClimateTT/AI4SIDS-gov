name: dmcu-prod

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: dmcu-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmcu_local}
      POSTGRES_DB: ${POSTGRES_DB:-dmcu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network

  ollama-prod:
    image: ollama/ollama:latest
    container_name: dmcu-prod-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
    expose:
      - "11434"
    # Serve first, then pull gpt-oss:20b (no-op if already cached).
    # First pull is large; later restarts only check the local blob.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull gpt-oss:20b
        wait $$pid
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  backend-prod:
    container_name: dmcu-prod-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    depends_on:
      postgres-prod:
        condition: service_healthy
      ollama-prod:
        condition: service_started
    expose:
      - "8082"
    ports:
      - "127.0.0.1:8000:8082"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dmcu:dmcu_local@postgres-prod:5432/dmcu}
      DEDUP_SALT: ${DEDUP_SALT:-dev-salt-change-in-production}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama-prod:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/Port_of_Spain}
      SURVEY123_TRANSPORT: ${SURVEY123_TRANSPORT:-inprocess}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8082/healthcheck')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - app-network
      - dokploy-network

  frontend-prod:
    container_name: dmcu-prod-frontend
    build:
      context: ./apps/frontend
      dockerfile: frontend.Dockerfile
      args:
        VITE_API_URL: /api
    expose:
      - "8081"
    depends_on:
      backend-prod:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - dokploy-network

networks:
  app-network:
  dokploy-network:
    external: true

volumes:
  postgres_data:
  ollama_data:
