server {
    listen 8081;
    root /usr/share/nginx/html;
    index index.html;

    # CSV / sitrep uploads go through /api/; default nginx limit is 1m.
    client_max_body_size 50m;

    resolver 127.0.0.11 valid=30s;
    # Filled in at container start from BACKEND_UPSTREAM (nginx image
    # envsubst). Production keeps backend-prod; staging points at its own API.
    set $backend http://${BACKEND_UPSTREAM};

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A capture turn streams its reply, then goes quiet while the model
        # writes the working set; a large report can pass two minutes.
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
