name: minister_regional_comparison
title: Ministerial Regional Comparison Briefing
description: One-page briefing comparing incident activity across corporations for a date window.
params:
  - name: date_from
    required: true
  - name: date_to
    required: true
data_requirements:
  - module: survey123
    metric: incidents_by_corporation
    params: { date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: homes_affected_count
    params: { date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: relief_actions_summary
    params: { date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: casualty_summary
    params: { date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: data_coverage
    params: { date_from: "{date_from}", date_to: "{date_to}" }
narration:
  system_prompt: |
    You are drafting a one-page ministerial sitrep for Trinidad and Tobago's
    Disaster Management Coordinating Unit. Compare regional incident activity
    across corporations for the reporting window.

    Lead with infrastructure and operational impact; state casualties once,
    factually, without embellishment. Keep the whole briefing to one page —
    short paragraphs, no filler.
  output_sections:
    - situation_overview
    - present_activity
    - regional_comparison
    - alert_and_actions
    - data_gaps
render:
  format: markdown
  include_citation_appendix: true
