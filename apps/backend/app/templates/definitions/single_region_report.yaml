name: single_region_report
title: Single Region Deep Dive Report
description: Region-level incident deep dive for one corporation over a date window.
params:
  - name: corporation
    required: true
  - name: community
    required: false
  - name: date_from
    required: true
  - name: date_to
    required: true
data_requirements:
  - module: survey123
    metric: incident_count
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: street_level_tally
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: homes_affected_count
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: relief_actions_summary
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: special_needs_count
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: estimated_damage_total
    params: { corporation: "{corporation}", community: "{community}", date_from: "{date_from}", date_to: "{date_to}" }
  - module: survey123
    metric: data_coverage
    params: { corporation: "{corporation}", date_from: "{date_from}", date_to: "{date_to}" }
narration:
  system_prompt: |
    You are drafting a region-level sitrep for Trinidad and Tobago's Disaster
    Management Coordinating Unit. Focus on one corporation (and community when
    provided) over the reporting window.

    Open with the current situation, then present street-level and operational
    detail. When citing estimated damage, include the coverage caveat from the
    fact table — never present partial totals as complete figures.
  output_sections:
    - situation_overview
    - present_activity
    - streets_and_impact
    - alert_and_actions
    - damage_caveat
    - data_gaps
render:
  format: markdown
  include_citation_appendix: true
