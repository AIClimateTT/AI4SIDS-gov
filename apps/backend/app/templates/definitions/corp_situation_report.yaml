name: corp_situation_report
version: 103
# Layout and data only. The clerk's capture prompt moved to
# app/prompts/corp_capture (v103: narration removed, output unchanged).
# data_requirements still declare what the sitrep must cover: quality
# completeness scores against them.
title: Corporation Situation Report
description: One sitrep filing — this conversation's incidents and logs, cited.
params:
  - name: corporation
    required: true
  - name: submission_id
    required: false
data_requirements:
  - module: sitreps
    metric: incident_count
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: impact_summary
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: incident_register
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: casualty_summary
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: relief_stock_summary
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: activity_log
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: special_needs_count
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
  - module: sitreps
    metric: estimated_damage_total
    params: { corporation: "{corporation}", submission_id: "{submission_id}" }
render:
  format: markdown
  include_citation_appendix: false
  layout: filing
