name: minister_situation_report
version: 101
title: Ministerial Situation Report
description: National situation report for the Minister, in the Full Sitrep 2023 format, built from each corporation's latest filing. Unverified during the event.
params:
  - name: date_from
    required: true
  - name: date_to
    required: true
  - name: as_at
  - name: hazard
  - name: present_activity
  - name: alert_level
  - name: situation_overview
    multiline: true
  - name: ministry_response
    multiline: true
data_requirements:
  - module: sitreps
    metric: corporation_status
    params: { date_from: "{date_from}", date_to: "{date_to}" }
narration:
  identity: |
    Rendered from the corporations' filed data, with no generated prose.
  skills:
    compose: Not narrated; rendered from data.
  output_sections: []
render:
  format: markdown
  include_citation_appendix: false
  layout: ministerial
