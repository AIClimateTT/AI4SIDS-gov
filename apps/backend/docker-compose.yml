name: dmcu-local

# Local Postgres only. The API and Procrastinate worker run on the host
# (`task start:backend` / `task start:worker`) so they share the same venv
# and the Ollama install on this machine.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dmcu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmcu_local}
      POSTGRES_DB: ${POSTGRES_DB:-dmcu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

volumes:
  postgres_data:
    name: dmcu-local_dmcu_postgres_data
