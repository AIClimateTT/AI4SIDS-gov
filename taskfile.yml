# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BACKEND_DIR: ./apps/backend
  FRONTEND_DIR: ./apps/frontend
  DATABASE_URL: "postgresql+psycopg://dmcu:dmcu_local@localhost:5434/dmcu"
  LOCAL_COMPOSE_FILE: ./apps/backend/docker-compose.local.yml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # Setup
  install:
    desc: Install all dependencies
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: Install backend dependencies
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - source .venv/bin/activate && uv pip install -r requirements.txt

  install:frontend:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm install

  # Build
  build:
    desc: Build all React Apps
    cmds:
      - task: build:frontend

  build:frontend:
    desc: Build the frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build

  # Start
  start-local:
    desc: Start all Apps
    cmds:
      - task: start:backend
      - task: start:frontend

  start:backend:
    shell: zsh
    desc: Start the backend
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - task: db:start
      - printf "\033]0;backend\007"
      - uv run fastapi dev app --host 0.0.0.0

  start:frontend:
    desc: Start the frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - printf "\033]0;admin\007"
      - pnpm dev

  # Migrations (alembic)
  migrate:up:
    desc: Run all pending migrations
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic upgrade head

  migrate:reset:
    desc: Rollback all migrations
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic downgrade base

  migrate:down:
    desc: Rollback the last migration
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run alembic downgrade -1

  # Database
  db:start:
    desc: Start local PostgreSQL if it is not already running
    cmds:
      - |
        if docker compose -f {{.LOCAL_COMPOSE_FILE}} ps --status running -q postgres | grep -q .; then
          echo "PostgreSQL is already running."
          exit 0
        fi
        echo "Starting PostgreSQL..."
        docker compose -f {{.LOCAL_COMPOSE_FILE}} start postgres
        echo "Waiting for PostgreSQL to be ready..."
        for i in $(seq 1 30); do
          if docker compose -f {{.LOCAL_COMPOSE_FILE}} exec postgres pg_isready -U dmcu -d dmcu -q 2>/dev/null; then
            echo "PostgreSQL is ready."
            exit 0
          fi
          sleep 1
        done
        echo "Timed out waiting for PostgreSQL."
        exit 1

  worker:start:
    desc: Run the Procrastinate worker on the host (same venv as the API)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - printf "\033]0;worker\007"
      - uv run python -c "from app.jobs.queue import apply_schema; apply_schema()"
      - uv run python -m procrastinate --app=app.jobs.queue.app worker --concurrency=1

  locust:api:
    desc: Locust API soak (backend must run with LLM_PROVIDER=fake)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run python -m locust -f loadtests/locustfile.py --tags api --host http://localhost:8000

  locust:chat:
    desc: Locust capture stream against a live model (use --users 1-4)
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - uv run python -m locust -f loadtests/locustfile.py --tags chat --host http://localhost:8000




 
  # Staging / UAT seeding (stacks are deployed by Dokploy)
  staging:seed:
    desc: ERASE staging data and seed the admin and corporation accounts
    prompt: This erases all staging data. Continue?
    cmds:
      - docker exec dmcu-staging-backend python -m app.cli db reset --yes

  remote:eval:
    desc: Run the capture test set in prod against NIM (eval runner) and save the result here. VERSION=1 for v1, REPEAT=n
    dir: apps/backend
    vars:
      VERSION: '{{.VERSION | default ""}}'
      REPEAT: '{{.REPEAT | default "3"}}'
    cmds:
      - uv run python -m app.cli prompts remote-eval corp_capture --repeat {{.REPEAT}} {{if .VERSION}}--version {{.VERSION}}{{end}}

  remote:runs:
    desc: List recent eval runs in prod
    dir: apps/backend
    cmds:
      - uv run python -m app.cli prompts remote-runs

  remote:info:
    desc: Which prompt versions and model the prod eval runner has deployed
    dir: apps/backend
    cmds:
      - uv run python -m app.cli prompts remote-info

  remote:sessions:
    desc: List capture chats the eval runner can replay. SOURCE=staging|prod CORP=arima SINCE=2026-11-01
    dir: apps/backend
    vars:
      SOURCE: '{{.SOURCE | default "staging"}}'
    cmds:
      - uv run python -m app.cli prompts remote-sessions --source {{.SOURCE}} {{if .CORP}}--corp {{.CORP}}{{end}} {{if .SINCE}}--since {{.SINCE}}{{end}}

  remote:session:
    desc: Show one chat's turns. ID=<session id> SOURCE=staging|prod
    dir: apps/backend
    vars:
      SOURCE: '{{.SOURCE | default "staging"}}'
    cmds:
      - uv run python -m app.cli prompts remote-session {{.ID}} --source {{.SOURCE}}

  remote:replay:
    desc: Replay a recorded chat in prod against NIM. ID=<session> SOURCE=staging|prod VERSIONS="1 2" DRAFT=1 MODE=chained
    dir: apps/backend
    vars:
      SOURCE: '{{.SOURCE | default "staging"}}'
      MODE: '{{.MODE | default "recorded"}}'
    cmds:
      - uv run python -m app.cli prompts remote-replay {{.ID}} --source {{.SOURCE}} --mode {{.MODE}} {{range $v := splitList " " (.VERSIONS | default "")}}{{if $v}}--version {{$v}} {{end}}{{end}}{{if .DRAFT}}--draft{{end}}

  prompts:check:
    desc: Fail if a prompt changed without a version bump
    dir: apps/backend
    cmds:
      - uv run python -m app.cli prompts check
